name: Studio workbench
on:
  push:
    branches: ['feature/polished-event-studio']
    paths: ['.github/workflows/studio-workbench.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npm install --no-save playwright@1.55.0 && node scripts/prepare-atelier.mjs
        working-directory: apps/booth
      - run: tar --exclude='.git' --exclude='*.env' --exclude='.env*' --exclude='node_modules/.cache' -czf /tmp/booth-workbench.tar.gz apps/booth .github node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: booth-workbench
          path: /tmp/booth-workbench.tar.gz
          retention-days: 1
