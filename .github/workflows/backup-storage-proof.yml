name: Photo Booth private backup proof
on:
  pull_request:
    paths:
      - 'apps/booth/**'
      - '.github/workflows/backup-storage-proof.yml'
  push:
    branches: [main]
    paths:
      - 'apps/booth/**'
      - '.github/workflows/backup-storage-proof.yml'
permissions:
  contents: read
jobs:
  backup-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booth
          POSTGRES_PASSWORD: booth
          POSTGRES_DB: booth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booth -d booth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DELIVERY_DATABASE_URL: postgresql://booth:booth@127.0.0.1:5432/booth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install booth dependencies
        working-directory: apps/booth
        run: npm install --no-audit --no-fund
      - name: Verify real backup database writes and deduplication
        working-directory: apps/booth
        run: node --test tests/backup-database.test.mjs
