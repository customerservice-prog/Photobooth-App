name: Atelier template proof
on:
  push:
    branches: [design/keepsake-atelier]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/booth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: node scripts/prepare-atelier.mjs
      - name: Real Next build and browser export proof
        run: |
          npx playwright install --with-deps chromium webkit > proof-output/browser-install.log 2>&1
          npm run test:delivery > proof-output/unit-tests.log 2>&1
          npm run build > proof-output/build.log 2>&1
          npm run start > proof-output/server.log 2>&1 &
          node scripts/atelier-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-proof
          path: apps/booth/proof-output/
          retention-days: 7
