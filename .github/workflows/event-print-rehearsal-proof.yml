name: Approved event printer rehearsal
on:
  push:
    branches: [main]
    paths:
      - 'apps/booth/**'
      - '.github/workflows/event-print-rehearsal-proof.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/booth/**'
      - '.github/workflows/event-print-rehearsal-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: event-print-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/booth
        shell: bash
    env:
      BOOTH_SECURITY_ENFORCED: 'true'
      BOOTH_STAFF_SESSION_SECRET: approved-print-rehearsal-local-session-fixture-only-v1
      BOOTH_PUBLIC_URL: https://127.0.0.1:3418
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Approved event rehearsal unit regressions
        run: node scripts/prepare-atelier.mjs && node --test tests/print-rehearsal.test.mjs tests/fpr-photo-layouts.test.mjs tests/staff-navigation.test.mjs
      - name: Real production build
        run: mkdir -p event-print-rehearsal-proof && npm run build 2>&1 | tee event-print-rehearsal-proof/build.log
      - name: iPad one/four JPEG, print geometry, event and archive isolation
        run: |
          BOOTH_PROOF_NEXT_CLI=$(node -p 'require.resolve("next/dist/bin/next")')
          node "$BOOTH_PROOF_NEXT_CLI" start -p 3000 > event-print-rehearsal-proof/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/app-version > /dev/null; then break; fi
            sleep 1
          done
          node scripts/event-print-rehearsal-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-event-print-rehearsal-${{ github.run_id }}
          path: apps/booth/event-print-rehearsal-proof/
          retention-days: 3
