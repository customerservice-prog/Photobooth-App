name: Smile photo sequence proof
on:
  push:
    branches: [main]
    paths: ['apps/booth/**', '.github/workflows/photo-sequence-proof.yml']
  pull_request:
    branches: [main]
    paths: ['apps/booth/**', '.github/workflows/photo-sequence-proof.yml']
permissions:
  contents: read
concurrency:
  group: smile-sequence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/booth
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Unit regressions and production build
        run: |
          mkdir -p sequence-proof
          npm run test:delivery 2>&1 | tee sequence-proof/unit.log
          npm run build 2>&1 | tee sequence-proof/build.log
      - name: Four different photos, iPad entry and preserved photo edges
        run: |
          npm run start > sequence-proof/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          node scripts/photo-sequence-proof.mjs
          node scripts/ipad-launch-proof.mjs
      - name: Verify deployed iPad launcher and camera sequence
        if: github.ref == 'refs/heads/main'
        env:
          SEQUENCE_BASE_URL: https://photobooth-booth-production.up.railway.app
          SEQUENCE_SMOKE: '1'
        run: |
          node --input-type=module <<'NODE'
          import {BOOTH_RELEASE} from './app/lib/booth-launch.mjs';
          let ready=false;
          for(let i=0;i<60;i++){
            try{const r=await fetch(process.env.SEQUENCE_BASE_URL+'/ipad',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(r.ok&&(await r.text()).includes('data-launch-version="'+BOOTH_RELEASE+'"')){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ready)throw new Error('This iPad launcher release is not deployed yet.');
          NODE
          mv sequence-proof local-sequence-proof
          node scripts/photo-sequence-proof.mjs
          node scripts/ipad-launch-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smile-sequence-${{ github.run_id }}
          path: |
            apps/booth/sequence-proof/
            apps/booth/local-sequence-proof/
          retention-days: 3
