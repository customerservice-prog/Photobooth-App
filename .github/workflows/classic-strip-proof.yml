name: Classic photo strip proof
on:
  push:
    branches: [main]
    paths: ['apps/booth/**', '.github/workflows/classic-strip-proof.yml']
  pull_request:
    branches: [main]
    paths: ['apps/booth/**', '.github/workflows/classic-strip-proof.yml']
permissions:
  contents: read
concurrency:
  group: classic-strip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/booth
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Unit tests and production build
        run: |
          mkdir -p strip-proof
          npm run test:delivery 2>&1 | tee strip-proof/unit.log
          npm run build 2>&1 | tee strip-proof/build.log
      - name: Verify card and strip choices, photos, outputs and one-sheet accounting
        run: |
          npm run start > strip-proof/server.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          node scripts/classic-strip-proof.mjs
      - name: Check exact deployed strip release
        if: github.ref == 'refs/heads/main'
        env:
          STRIP_BASE_URL: https://photobooth-booth-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          import {BOOTH_RELEASE} from './app/lib/booth-launch.mjs';
          let ready=false;
          for(let n=0;n<60;n++){
            try{const r=await fetch(process.env.STRIP_BASE_URL+'/api/app-version',{cache:'no-store',signal:AbortSignal.timeout(8000)});if(r.ok&&(await r.json()).version===BOOTH_RELEASE){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ready)throw new Error('The expected photo-strip release has not deployed.');
          NODE
          mv strip-proof local-strip-proof
          node scripts/classic-strip-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classic-strips-${{ github.run_id }}
          path: |
            apps/booth/strip-proof/
            apps/booth/local-strip-proof/
          retention-days: 3
