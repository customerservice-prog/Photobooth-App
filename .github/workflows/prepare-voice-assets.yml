name: Prepare recorded booth voice
on:
  push:
    branches: [fix/audible-photo-guidance]
    paths: ['.github/workflows/prepare-voice-assets.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng
      - name: Record and save static voice assets
        run: |
          mkdir -p apps/booth/public/audio
          python3 - <<'PY'
          import subprocess
          cues={'ready':'Get ready.', '3':'Three.', '2':'Two.', '1':'One.', 'smile':'Smile!', 'next2':'Photo one complete. Change your pose. Photo two is next.', 'next3':'Photo two complete. Change your pose. Photo three is next.', 'next4':'Photo three complete. Change your pose. Last photo is next.'}
          for key,text in cues.items():
              subprocess.run(['espeak-ng','-v','en-us','-s','205','-w','apps/booth/public/audio/'+key+'.wav',text],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/booth/public/audio
          git diff --cached --quiet || git commit -m 'Record bundled countdown and next-photo voice clips'
          git push origin HEAD:fix/audible-photo-guidance
