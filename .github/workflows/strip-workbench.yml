name: Photo strip isolated workbench
on:
  push:
    branches: [feature/classic-photo-strips]
    paths: ['.github/workflows/strip-workbench.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline development bundle
        run: |
          mkdir -p /tmp/booth-workbench
          git archive HEAD | tar -x -C /tmp/booth-workbench
          cd /tmp/booth-workbench/apps/booth
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          node scripts/prepare-atelier.mjs
          cd /tmp
          tar -czf booth-workbench.tgz booth-workbench
      - uses: actions/upload-artifact@v4
        with:
          name: photo-strip-workbench
          path: /tmp/booth-workbench.tgz
          retention-days: 1
