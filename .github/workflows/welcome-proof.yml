name: Focused Birthday WebKit verification
on:
  push:
    branches: [codex/verify-birthday-webkit-20261009]
    paths:
      - '.github/workflows/welcome-proof.yml'
permissions:
  contents: read
concurrency:
  group: birthday-webkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/booth
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps webkit
      - name: Build unchanged main product
        run: mkdir -p birthday-webkit-proof && npm run build 2>&1 | tee birthday-webkit-proof/build.log
      - name: Verify Birthday 1 and 4 in WebKit
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          const source=await readFile('scripts/guest-finish-proof.mjs','utf8');
          const engine=/^const engines=.*$/m;
          assert(engine.test(source),'engine declaration exists');
          const cases='standardEvents.flatMap(fixture=>';
          assert.equal(source.split(cases).length,2,'one standard fixture selector');
          const focused=source.replace(engine,"const engines=[['webkit',webkit]];")
            .replace(cases,"standardEvents.filter(fixture=>fixture.label==='birthday').flatMap(fixture=>");
          const runCase=text=>text.slice(text.indexOf('async function runCase('),text.indexOf('\ntry{\n for(const [engine,api]of engines)'));
          assert.equal(runCase(focused),runCase(source),'actual runCase assertions stay identical');
          await writeFile('scripts/.birthday-webkit-proof.mjs',focused);
          NODE
          node --check scripts/.birthday-webkit-proof.mjs
          BOOTH_PROOF_NEXT_CLI=$(node -p 'require.resolve("next/dist/bin/next")')
          node "$BOOTH_PROOF_NEXT_CLI" start -p 3000 > birthday-webkit-proof/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -f scripts/.birthday-webkit-proof.mjs' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/app-version > /dev/null; then break; fi
            sleep 1
          done
          EVENT_DESIGN_PROOF=1 node scripts/.birthday-webkit-proof.mjs 2>&1 | tee birthday-webkit-proof/browser.log
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const report=JSON.parse(await readFile('event-design-proof/results.json','utf8'));
          assert.equal(report.results.length,2);
          assert.deepEqual(report.results.map(item=>item.test).sort(),['webkit-birthday-1-photo','webkit-birthday-4-photo']);
          for(const item of report.results){
            assert(item.passed);
            assert.equal(item.selectedDesign,'birthday/ivory');
            assert.equal(item.exactArchivedAndDownloadedJPEG,true);
            assert.equal(item.uniquePoses,item.poses);
            assert.equal(item.geometry.length,3);
            assert.deepEqual(item.writeRequests,[]);
            assert.deepEqual(item.protectedVisits,[]);
            assert.equal(item.state.usage,'19');
            assert.equal(item.state.prints,0);
            assert.equal(item.state.shares,0);
          }
          console.log('WebKit Birthday 2/2 PASS; 6 responsive views; exact JPEGs; distinct poses; zero writes/prints/shares.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birthday-webkit-proof-${{ github.run_id }}
          path: |
            apps/booth/birthday-webkit-proof/
            apps/booth/event-design-proof/
          retention-days: 3
