name: Premium welcome proof
on:
  push:
    branches: [main]
    paths:
      - 'apps/booth/**'
      - '.github/workflows/welcome-proof.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/booth/**'
      - '.github/workflows/welcome-proof.yml'
permissions:
  contents: read
concurrency:
  group: welcome-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/booth
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Existing unit regressions
        run: mkdir -p welcome-proof && npm run test:delivery 2>&1 | tee welcome-proof/unit-tests.log
      - name: Real production build
        run: npm run build 2>&1 | tee welcome-proof/build.log
      - name: Finished-photo and custom-artwork browser proof
        run: |
          BOOTH_PROOF_NEXT_CLI=$(node -p 'require.resolve("next/dist/bin/next")')
          node "$BOOTH_PROOF_NEXT_CLI" start -p 3000 > welcome-proof/finished-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/app-version > /dev/null; then break; fi
            sleep 1
          done
          node scripts/guest-finish-proof.mjs
          CUSTOM_DESIGN_PROOF=1 node scripts/guest-finish-proof.mjs
          EVENT_DESIGN_PROOF=1 node scripts/guest-finish-proof.mjs
      - name: Welcome and event-setup browser proof
        run: |
          BOOTH_PROOF_NEXT_CLI=$(node -p 'require.resolve("next/dist/bin/next")')
          node "$BOOTH_PROOF_NEXT_CLI" start -p 3000 > welcome-proof/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node scripts/welcome-proof.mjs
          node scripts/preparation-layout-proof.mjs
          node scripts/event-studio-proof.mjs
      - name: Browser proof against deployed Railway booth
        if: github.ref == 'refs/heads/main'
        env:
          WELCOME_BASE_URL: https://photobooth-booth-production.up.railway.app
        run: |
          node --input-type=module <<'NODE'
          import {BOOTH_RELEASE} from './app/lib/booth-launch.mjs';
          let ready=false;
          for(let n=0;n<90;n++){
            try{
              const r=await fetch(process.env.WELCOME_BASE_URL+'/api/app-version',{cache:'no-store',signal:AbortSignal.timeout(8000)});
              if(r.ok&&(await r.json()).version===BOOTH_RELEASE){ready=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw new Error('Exact booth release '+BOOTH_RELEASE+' is not live yet; inspect Railway.');
          NODE
          mv welcome-proof local-welcome-proof
          node scripts/welcome-live-proof.mjs
          GUEST_FINISH_BASE_URL="$WELCOME_BASE_URL" node scripts/guest-finish-proof.mjs
          CUSTOM_DESIGN_PROOF=1 GUEST_FINISH_BASE_URL="$WELCOME_BASE_URL" node scripts/guest-finish-proof.mjs
          EVENT_DESIGN_PROOF=1 GUEST_FINISH_BASE_URL="$WELCOME_BASE_URL" node scripts/guest-finish-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-welcome-proof-${{ github.run_id }}
          path: |
            apps/booth/welcome-proof/
            apps/booth/local-welcome-proof/
            apps/booth/guest-finish-proof/
            apps/booth/custom-design-proof/
            apps/booth/event-design-proof/
          retention-days: 3
