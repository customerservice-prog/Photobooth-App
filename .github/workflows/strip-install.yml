name: Apply reviewed classic-strip source changes
on:
  push:
    branches: [feature/classic-photo-strips]
    paths: ['.github/workflows/strip-install.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'customerservice-prog/Photobooth-App' && github.ref == 'refs/heads/feature/classic-photo-strips'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/classic-photo-strips
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source edits on feature branch only
        run: |
          python .github/implement-strips.py
          rm .github/implement-strips.py .github/workflows/strip-install.yml
          git diff --check
      - name: Verify source before recording changes
        working-directory: apps/booth
        run: |
          npm install --no-audit --no-fund
          npm run test:delivery
          npm run build
      - name: Commit tested source on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'Wire classic photo strips into guest output, staff setup and iPad release'
          git push origin HEAD:refs/heads/feature/classic-photo-strips
