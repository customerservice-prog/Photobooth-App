name: Photo strip proof
on:
  push:
    branches: [feature/photo-strip-print-controls]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/booth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test:delivery
      - name: Production build
        run: npm run build
